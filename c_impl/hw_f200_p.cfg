# hw_f200_p.cfg -- the production 200 MHz link recipe (Iter79, promoted 2026-10-04).
#
# Three kernels from one source, one per SLR: gdn_forward_p (control: port 0/1/18-23
# GEMV clusters, store, conv, output norm, residuals, lm_head argmax) on SLR1,
# gdn_k_slr0 (ports 2-17, clusters 1-8) on SLR0, gdn_k_slr2 (ports 24-31, clusters
# 12-15, the recurrent islands and the state writers) on SLR2.  Seven AXI-Stream links
# carry activations, partial results, conv output, per-head scalars and attention.
# Every AXI master sits on the die of its HBM pseudo-channel; aux_weights and workspace
# share master mm0 on HBM[0] (the shell's 32-master limit).  Bank ranges stay disjoint.
#
# Physical recipe: apply_p_islands.tcl (OPT_DESIGN.PRE) sources the kernel-clock XDC
# override and places the two recurrent islands in quarter-SLR pblocks on SLR2;
# SSI_SpreadLogic_high placement, AlternateCLBRouting, pre/post-route AggressiveExplore;
# finish_p_timing.tcl (POST_ROUTE_PHYS_OPT_DESIGN.TCL.POST) runs the Explore -> focused
# kernel pass ladder and the exact-clock gate on all three clocks (check_p_final_timing.tcl):
# the kernel and DMA clocks must close exactly; hbm_aclk closes exactly too unless the
# build exports GDN_HBM_MIN_MHZ (bounded auto-scaling of the shell's HBM AXI clock, an
# escape hatch the shipped image did not need: +0.015 ns at 450 MHz).
# Measured on the promoted image (builds 6548 / 6568): kernel +0.029 ns at 5.000 ns,
# DMA +0.003 ns, hbm_aclk +0.015 ns; routed per SLR: CLB slices 91 / 91 / 92 % (the
# monolith: 97 / 76 / 78), LUTs 46 / 53 / 57 %, SLLs 24,833 (was 32,965).
#
# Paths are relocatable: @C_IMPL_DIR@ is substituted by the Makefile into
# $(BUILD_DIR)/resolved_hw.cfg.

[connectivity]
nk=gdn_forward_p:1:gdn_forward_p_1
nk=gdn_k_slr0:1:gdn_k_slr0_1
nk=gdn_k_slr2:1:gdn_k_slr2_1
# Iter79: one kernel per SLR.  The shell registers the HBM paths of the
# SLR1/SLR2 masters (probe 0b); the kernel-to-kernel streams are registered
# by the HLS ports themselves (probe 0a).
slr=gdn_forward_p_1:SLR1
slr=gdn_k_slr0_1:SLR0
slr=gdn_k_slr2_1:SLR2
sp=gdn_forward_p_1.aux_weights:HBM[0]
sp=gdn_forward_p_1.workspace:HBM[0]
sp=gdn_forward_p_1.weight_data_mm0:HBM[0]
sp=gdn_forward_p_1.weight_data_mm1:HBM[1]
sp=gdn_forward_p_1.weight_data_mm18:HBM[18]
sp=gdn_forward_p_1.weight_data_mm19:HBM[19]
sp=gdn_forward_p_1.weight_data_mm20:HBM[20]
sp=gdn_forward_p_1.weight_data_mm21:HBM[21]
sp=gdn_forward_p_1.weight_data_mm22:HBM[22]
sp=gdn_forward_p_1.weight_data_mm23:HBM[23]
sp=gdn_k_slr0_1.weight_data_mm2:HBM[2]
sp=gdn_k_slr0_1.weight_data_mm3:HBM[3]
sp=gdn_k_slr0_1.weight_data_mm4:HBM[4]
sp=gdn_k_slr0_1.weight_data_mm5:HBM[5]
sp=gdn_k_slr0_1.weight_data_mm6:HBM[6]
sp=gdn_k_slr0_1.weight_data_mm7:HBM[7]
sp=gdn_k_slr0_1.weight_data_mm8:HBM[8]
sp=gdn_k_slr0_1.weight_data_mm9:HBM[9]
sp=gdn_k_slr0_1.weight_data_mm10:HBM[10]
sp=gdn_k_slr0_1.weight_data_mm11:HBM[11]
sp=gdn_k_slr0_1.weight_data_mm12:HBM[12]
sp=gdn_k_slr0_1.weight_data_mm13:HBM[13]
sp=gdn_k_slr0_1.weight_data_mm14:HBM[14]
sp=gdn_k_slr0_1.weight_data_mm15:HBM[15]
sp=gdn_k_slr0_1.weight_data_mm16:HBM[16]
sp=gdn_k_slr0_1.weight_data_mm17:HBM[17]
sp=gdn_k_slr2_1.weight_data_mm24:HBM[24]
sp=gdn_k_slr2_1.weight_data_mm25:HBM[25]
sp=gdn_k_slr2_1.weight_data_mm26:HBM[26]
sp=gdn_k_slr2_1.weight_data_mm27:HBM[27]
sp=gdn_k_slr2_1.weight_data_mm28:HBM[28]
sp=gdn_k_slr2_1.weight_data_mm29:HBM[29]
sp=gdn_k_slr2_1.weight_data_mm30:HBM[30]
sp=gdn_k_slr2_1.weight_data_mm31:HBM[31]
stream_connect=gdn_forward_p_1.xr_to_slr0:gdn_k_slr0_1.xr_in
stream_connect=gdn_forward_p_1.xr_to_slr2:gdn_k_slr2_1.xr_in
stream_connect=gdn_k_slr0_1.ys_out:gdn_forward_p_1.ys_from_slr0
stream_connect=gdn_k_slr2_1.ys_out:gdn_forward_p_1.ys_from_slr2
stream_connect=gdn_forward_p_1.conv_to_slr2:gdn_k_slr2_1.conv_in
stream_connect=gdn_k_slr2_1.attn_out:gdn_forward_p_1.attn_from_slr2
stream_connect=gdn_forward_p_1.scalars_to_slr2:gdn_k_slr2_1.scalars_in
[vivado]
prop=run.__KERNEL__.{STEPS.SYNTH_DESIGN.ARGS.MORE OPTIONS}={-directive Default}
# clock override (true LINK_FREQ period) then the two quarter-SLR island pblocks
prop=run.impl_1.STEPS.OPT_DESIGN.TCL.PRE=@C_IMPL_DIR@/apply_p_islands.tcl
prop=run.impl_1.{STEPS.PLACE_DESIGN.ARGS.MORE OPTIONS}={-verbose}
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AlternateCLBRouting
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.TCL.POST=@C_IMPL_DIR@/finish_p_timing.tcl
