[connectivity]
nk=gdn_forward:1:gdn_forward_1

# The 1.3B FP32 weight blob is 5.5 GB, so it cannot live in one 256 MB U55C
# HBM pseudo-channel. Map the dedicated weight AXI bundle across the rest of
# HBM while leaving the smaller activation/state buffers on the default HBM[0].
# Phase B HBM channel map. Weights (2 x 5.34 GB) compressed to HBM[10:31]
# (22 ch = 11.3 GB) to free HBM[0:9] for activations, which are split across
# 3 dedicated AXI masters so each stage's read+write run on parallel channels
# instead of contending on a single gmem port.
#   HBM[0]     : control/small (config, a, b, recurrent_state, head_buffer, tokens)
#   HBM[1:3]   : gmem_x   (x, x_norm, tmp_hidden)
#   HBM[4:6]   : gmem_qkv (q, k, v, gate, attn)
#   HBM[7:9]   : gmem_mlp (mlp_gate, mlp_up)
#   HBM[10:31] : weights  (weight_data, weight_data_mm)
sp=gdn_forward_1.weight_data:HBM[10:31]
sp=gdn_forward_1.weight_data_mm:HBM[10:31]
sp=gdn_forward_1.x:HBM[1:3]
sp=gdn_forward_1.x_norm:HBM[1:3]
sp=gdn_forward_1.tmp_hidden:HBM[1:3]
sp=gdn_forward_1.q:HBM[4:6]
sp=gdn_forward_1.k:HBM[4:6]
sp=gdn_forward_1.v:HBM[4:6]
sp=gdn_forward_1.gate:HBM[4:6]
sp=gdn_forward_1.attn:HBM[4:6]
sp=gdn_forward_1.mlp_gate:HBM[7:9]
sp=gdn_forward_1.mlp_up:HBM[7:9]

[vivado]
# Vitis --optimize 2 injects sdx_optimization_effort_high for kernel OOC
# synthesis. On the shared U55C host that run was SIGKILLed after a large
# memory spike before producing a DCP. Use the standard Vivado synth directive
# instead; this is a build-QoR knob only and leaves the HLS schedule/datapath
# unchanged.
prop=run.__KERNEL__.{STEPS.SYNTH_DESIGN.ARGS.MORE OPTIONS}={-directive Default}

# NOTE: pblock_pe_split.tcl floorplanned the 16 ProcessingElement cells of the
# OLD systolic chain across SLR0/SLR1. The weight-traffic-optimized matmul
# (gdn_matmul_2d) has no ProcessingElement chain — that script would error
# ("expected 16 ProcessingElement cells, found 0"). The new kernel is lighter
# (DSP 26% vs 32%, BRAM 13% vs 38%) so the SSI_SpreadLogic_high directive below
# handles SLR spreading without an explicit pblock. Re-add a pblock here only
# if route_design reports congestion.
# prop=run.impl_1.STEPS.OPT_DESIGN.TCL.PRE={/home/yaoz0b/GatedDeltaNet/c_impl/pblock_pe_split.tcl}

# Preserve the requested kernel clock and datapath while giving implementation
# a congestion-oriented SSI strategy. The failed build placed SLR1 at high CLB
# density and route_design stopped at global congestion level 7.
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=SSI_SpreadLogic_high
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AlternateCLBRouting
