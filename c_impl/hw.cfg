[connectivity]
nk=gdn_forward:1:gdn_forward_1

# The 1.3B FP32 weight blob is 5.5 GB, so it cannot live in one 256 MB U55C
# HBM pseudo-channel. Map the dedicated weight AXI bundle across the rest of
# HBM while leaving the smaller activation/state buffers on the default HBM[0].
# Stage 2c (N=8) HBM bank map. DEDICATED, NON-OVERLAPPING ranges (512 MiB/bank).
# XRT 2022.1 allocates each xrt::bo bottom-up/contiguous within its group, so two
# weight bos whose sp= ranges overlap collide → std::bad_alloc (see
# probe_alloc.cpp + doc 6c). Every weight bo gets its own range. Sizes: weight_data
# 5.46 GiB → 11 banks; each of the 8 shards 0.62 GiB → 2 banks. 11 + 8*2 = 27
# weight banks. Decode activations are tiny (read once per token), so the 3 gmem
# masters stay at 1 bank each (HBM[1:3]). 27 weight + 4 activation/control = 31 of
# 32 banks (HBM[31] free). Note: 8 weight + 3 act + control = 12 HBM masters.
#   HBM[0]     : control/small (config, a, b, recurrent_state, head_buffer, tokens)
#   HBM[1]     : gmem_x   (x, x_norm, tmp_hidden)
#   HBM[2]     : gmem_qkv (q, k, v, gate, attn)
#   HBM[3]     : gmem_mlp (mlp_gate, mlp_up)
#   HBM[4:5]   : weight_data_mm   (gemv shard 0)
#   HBM[6:7]   : weight_data_mm2  (gemv shard 1)
#   HBM[8:9]   : weight_data_mm3  (gemv shard 2)
#   HBM[10:11] : weight_data_mm4  (gemv shard 3)
#   HBM[12:13] : weight_data_mm5  (gemv shard 4)
#   HBM[14:15] : weight_data_mm6  (gemv shard 5)
#   HBM[16:17] : weight_data_mm7  (gemv shard 6)
#   HBM[18:19] : weight_data_mm8  (gemv shard 7)   — 8 disjoint groups → ~8x BW
#   HBM[20:30] : weight_data      (full blob, scalar reads — 11 banks)
#   HBM[31]    : free
sp=gdn_forward_1.weight_data:HBM[20:30]
sp=gdn_forward_1.weight_data_mm:HBM[4:5]
sp=gdn_forward_1.weight_data_mm2:HBM[6:7]
sp=gdn_forward_1.weight_data_mm3:HBM[8:9]
sp=gdn_forward_1.weight_data_mm4:HBM[10:11]
sp=gdn_forward_1.weight_data_mm5:HBM[12:13]
sp=gdn_forward_1.weight_data_mm6:HBM[14:15]
sp=gdn_forward_1.weight_data_mm7:HBM[16:17]
sp=gdn_forward_1.weight_data_mm8:HBM[18:19]
sp=gdn_forward_1.x:HBM[1]
sp=gdn_forward_1.x_norm:HBM[1]
sp=gdn_forward_1.tmp_hidden:HBM[1]
sp=gdn_forward_1.q:HBM[2]
sp=gdn_forward_1.k:HBM[2]
sp=gdn_forward_1.v:HBM[2]
sp=gdn_forward_1.gate:HBM[2]
sp=gdn_forward_1.attn:HBM[2]
sp=gdn_forward_1.mlp_gate:HBM[3]
sp=gdn_forward_1.mlp_up:HBM[3]

[vivado]
# Vitis --optimize 2 injects sdx_optimization_effort_high for kernel OOC
# synthesis. On the shared U55C host that run was SIGKILLed after a large
# memory spike before producing a DCP. Use the standard Vivado synth directive
# instead; this is a build-QoR knob only and leaves the HLS schedule/datapath
# unchanged.
prop=run.__KERNEL__.{STEPS.SYNTH_DESIGN.ARGS.MORE OPTIONS}={-directive Default}

# NOTE: pblock_pe_split.tcl floorplanned the 16 ProcessingElement cells of the
# OLD systolic chain across SLR0/SLR1. The weight-traffic-optimized matmul
# (gdn_matmul_2d) has no ProcessingElement chain — that script would error
# ("expected 16 ProcessingElement cells, found 0"). The new kernel is lighter
# (DSP 26% vs 32%, BRAM 13% vs 38%) so the SSI_SpreadLogic_high directive below
# handles SLR spreading without an explicit pblock. Re-add a pblock here only
# if route_design reports congestion.
# prop=run.impl_1.STEPS.OPT_DESIGN.TCL.PRE={/home/yaoz0b/GatedDeltaNet/c_impl/pblock_pe_split.tcl}

# Preserve the requested kernel clock and datapath while giving implementation
# a congestion-oriented SSI strategy. The failed build placed SLR1 at high CLB
# density and route_design stopped at global congestion level 7.
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=SSI_SpreadLogic_high
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
# Stage 2 (2 weight readers + 2-wide MAC) hit congestion lvl 7 + partially-
# conflicted full_dsp fp-adder nets with AlternateCLBRouting. Explore is the
# congestion-aware router directive; paired with moving the gemv fp-adds to LUT
# fabric (bind_op in gdn_gemv) to thin the DSP region.
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=Explore
