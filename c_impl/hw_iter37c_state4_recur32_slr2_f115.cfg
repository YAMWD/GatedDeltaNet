[connectivity]
nk=gdn_forward:1:gdn_forward_1

# Preserve the routed 32-port topology. Recurrent state remains appended to
# weight shards 28..31; Iter37D changes physical placement only.
sp=gdn_forward_1.aux_weights:HBM[0]
sp=gdn_forward_1.weight_data_mm0:HBM[0]
sp=gdn_forward_1.weight_data_mm1:HBM[1]
sp=gdn_forward_1.weight_data_mm2:HBM[2]
sp=gdn_forward_1.weight_data_mm3:HBM[3]
sp=gdn_forward_1.weight_data_mm4:HBM[4]
sp=gdn_forward_1.weight_data_mm5:HBM[5]
sp=gdn_forward_1.weight_data_mm6:HBM[6]
sp=gdn_forward_1.weight_data_mm7:HBM[7]
sp=gdn_forward_1.weight_data_mm8:HBM[8]
sp=gdn_forward_1.weight_data_mm9:HBM[9]
sp=gdn_forward_1.weight_data_mm10:HBM[10]
sp=gdn_forward_1.weight_data_mm11:HBM[11]
sp=gdn_forward_1.weight_data_mm12:HBM[12]
sp=gdn_forward_1.weight_data_mm13:HBM[13]
sp=gdn_forward_1.weight_data_mm14:HBM[14]
sp=gdn_forward_1.weight_data_mm15:HBM[15]
sp=gdn_forward_1.weight_data_mm16:HBM[16]
sp=gdn_forward_1.weight_data_mm17:HBM[17]
sp=gdn_forward_1.weight_data_mm18:HBM[18]
sp=gdn_forward_1.weight_data_mm19:HBM[19]
sp=gdn_forward_1.weight_data_mm20:HBM[20]
sp=gdn_forward_1.weight_data_mm21:HBM[21]
sp=gdn_forward_1.weight_data_mm22:HBM[22]
sp=gdn_forward_1.weight_data_mm23:HBM[23]
sp=gdn_forward_1.weight_data_mm24:HBM[24]
sp=gdn_forward_1.weight_data_mm25:HBM[25]
sp=gdn_forward_1.weight_data_mm26:HBM[26]
sp=gdn_forward_1.weight_data_mm27:HBM[27]
sp=gdn_forward_1.weight_data_mm28:HBM[28]
sp=gdn_forward_1.weight_data_mm29:HBM[29]
sp=gdn_forward_1.weight_data_mm30:HBM[30]
sp=gdn_forward_1.weight_data_mm31:HBM[31]
sp=gdn_forward_1.workspace:HBM[0]

[vivado]
prop=run.__KERNEL__.{STEPS.SYNTH_DESIGN.ARGS.MORE OPTIONS}={-directive Default}

# The launcher resolves @C_IMPL_DIR@ into the current checkout path, keeping
# this committed recipe relocatable without relying on a binary RQS payload.
prop=run.impl_1.STEPS.OPT_DESIGN.TCL.PRE=@C_IMPL_DIR@/apply_iter37c_recurrent_slr2.tcl
prop=run.impl_1.STEPS.PLACE_DESIGN.TCL.PRE=@C_IMPL_DIR@/apply_iter35_dma_w15_fifoaddr_fanout.tcl

# Iter37B's failure was dominated by SLR distribution and routing resource
# conflicts, while post-placement WNS was already approximately -0.006 ns.
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=SSI_SpreadSLLs
prop=run.impl_1.{STEPS.PLACE_DESIGN.ARGS.MORE OPTIONS}={-verbose}
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AlternateCLBRouting
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
